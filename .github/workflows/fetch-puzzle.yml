name: Fetch Spelling Bee

on:
  schedule:
    - cron: '5 5 * * *'  # 5:05 AM UTC daily (midnight ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch puzzle data
        run: |
          curl -s 'https://www.nytimes.com/puzzles/spelling-bee' \
            -H 'User-Agent: Mozilla/5.0' \
          | python3 -c "
          import sys, re, json

          html = sys.stdin.read()
          match = re.search(r'window\.gameData\s*=\s*', html)
          if not match:
              print('No gameData found', file=sys.stderr)
              sys.exit(1)

          decoder = json.JSONDecoder()
          data, _ = decoder.raw_decode(html, match.end())
          today = data['today']

          out = {
              'printDate': today['printDate'],
              'centerLetter': today['centerLetter'],
              'outerLetters': today['outerLetters'],
              'validLetters': today['validLetters'],
              'answers': today['answers'],
              'pangrams': today['pangrams'],
          }

          with open('today.json', 'w') as f:
              json.dump(out, f)
          print(f\"Fetched puzzle for {today['printDate']}: {len(today['answers'])} answers\")
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update puzzle data for $(date -u +%Y-%m-%d)"
          git push
